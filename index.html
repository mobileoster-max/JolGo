<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JolGo 9999: God Mode</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --gold: #ffd700; --main: #00ff88; --bg: #000; --card: #111; --vip: linear-gradient(45deg, #ffd700, #ff8800); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Arial Black', sans-serif; }
        
        #auth { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; color: #000; width: 85%; padding: 40px; border-radius: 40px; text-align: center; border: 6px solid var(--main); }
        
        .header { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #222; position: sticky; top:0; background:#000; z-index: 100; }
        .xp-badge { color: var(--gold); border: 2px solid var(--gold); padding: 5px 15px; border-radius: 20px; font-size: 14px; }

        .page { padding: 15px; display: none; padding-bottom: 100px; animation: zoomIn 0.3s ease; }
        .active { display: block; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .card { background: var(--card); border-radius: 25px; margin-bottom: 20px; border: 1px solid #333; overflow: hidden; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        
        .badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .badge-box { background: #1a1a1a; padding: 15px; border-radius: 20px; text-align: center; border: 1px solid #333; opacity: 0.3; filter: grayscale(1); }
        .badge-box.unlocked { opacity: 1; filter: grayscale(0); border: 2px solid var(--gold); background: #222; }

        #cert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .cert { background: #000; border: 10px double var(--gold); padding: 30px; border-radius: 20px; text-align: center; width: 100%; box-shadow: 0 0 50px var(--gold); }
        .gold-v { background: var(--vip); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 20px; font-weight: 900; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--main); color: #000; }
        
        .nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: #000; display: flex; border-top: 2px solid #222; }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #555; }
        .tab.on { color: var(--main); }
        
        .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
        .lang-btn { background: #222; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 10px; font-size: 10px; }

        .rank-list { background: #0a0a0a; border-radius: 20px; padding: 10px; margin-top: 10px; }
        .rank-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; font-size: 14px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 15000; display: none; flex-direction: column; padding: 30px; justify-content: center; overflow-y: auto; }
        .opt { background: #1a1a1a; padding: 20px; margin: 10px 0; border-radius: 20px; text-align: center; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="auth">
    <div class="login-box">
        <h1>JolGo</h1>
        <p>TITANIUM 9999 GOD MODE</p>
        <input type="text" id="u-in" placeholder="NAME / АТЫҢЫЗ" style="width:80%; padding:15px; margin:20px 0; border-radius:15px; text-align:center;">
        <button class="btn btn-main" onclick="initApp()">GO / БАШТОО</button>
    </div>
</div>

<div class="header">
    <div style="font-size:24px; color:var(--main)">JolGo</div>
    <div class="xp-badge">🏆 <span id="xp-val">0</span> XP</div>
</div>

<div id="p1" class="page active">
    <div id="list"></div>
</div>

<div id="p2" class="page">
    <div id="map" style="height:400px; border-radius:30px; border:2px solid #333;"></div>
</div>

<div id="p3" class="page">
    <div style="text-align:center;">
        <h2 id="u-name" style="margin:0"></h2>
        <h3 id="u-title" style="color:var(--gold); margin-bottom:20px;">RANK</h3>
        
        <div class="lang-grid">
            <button class="lang-btn" onclick="setL('ky')">🇰🇬 KY</button>
            <button class="lang-btn" onclick="setL('ru')">🇷🇺 RU</button>
            <button class="lang-btn" onclick="setL('en')">🇺🇸 EN</button>
            <button class="lang-btn" onclick="setL('ar')">🇸🇦 AR</button>
            <button class="lang-btn" onclick="setL('zh')">🇨🇳 ZH</button>
        </div>

        <h4 id="ui-achive" style="text-align:left; color:var(--main); margin-top:20px;">🏅 ТИТУЛДАР</h4>
        <div class="badge-grid" id="badge-display"></div>

        <h4 id="ui-lead" style="text-align:left; color:var(--main); margin-top:30px;">📊 ЛИДЕРЛЕР</h4>
        <div class="rank-list" id="rank-box"></div>
    </div>
</div>

<div id="cert-overlay">
    <div class="cert">
        <h1 class="gold-v" style="font-size:40px;" id="cert-head">ЗАВОЕВАТЕЛЬ</h1>
        <p id="cert-text1">Бул жогорку даражадагы VIP сертификат берилет:</p>
        <h2 id="cert-user" style="text-transform:uppercase; color:#fff; border-bottom: 2px solid var(--gold); display:inline-block;"></h2>
        <p style="margin-top:20px;" id="cert-text2">Талас облусун толук багындырып, УЛУУ КӨЧМӨН статусуна жеткени үчүн!</p>
        <div style="font-size:50px">👑👑👑</div>
        <button class="btn btn-main" onclick="document.getElementById('cert-overlay').style.display='none'">OK!</button>
    </div>
</div>

<div id="info-modal" class="modal">
    <h2 id="info-n" style="color:var(--main)"></h2>
    <p id="info-t" style="line-height: 1.6; font-size: 14px; text-align: justify;"></p>
    <button class="btn btn-main" id="q-start">START</button>
    <button class="btn" style="background:#333; color:#fff" onclick="closeM('info-modal')">BACK</button>
</div>

<div id="quiz-modal" class="modal">
    <h3 id="q-txt"></h3>
    <div id="q-opt"></div>
</div>

<div class="nav">
    <div class="tab on" onclick="go('p1',this)" id="tab-home">🏠<br>Башкы</div>
    <div class="tab" onclick="go('p2',this); initMap();" id="tab-map">🗺️<br>Карта</div>
    <div class="tab" onclick="go('p3',this)" id="tab-prof">👤<br>Профиль</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    // УЛУУ ЖАНА ТУУРА ЗВУК ЭФФЕКТЕРИ
    const playSound = (type) => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = ctx.createGain();
        masterGain.connect(ctx.destination);
        masterGain.gain.setValueAtTime(0.1, ctx.currentTime);

        if(type === 'win') {
            // Туура болсо: Бийик жана кубанычтуу добуш (C5 -> E5 -> G5)
            const notes = [523.25, 659.25, 783.99]; 
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                g.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.1 + 0.3);
                osc.connect(g); g.connect(masterGain);
                osc.start(ctx.currentTime + i * 0.1);
                osc.stop(ctx.currentTime + i * 0.1 + 0.3);
            });
        } else {
            // Ката болсо: Төмөнкү жана эскертүүчү добуш (200Hz -> 100Hz)
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
            g.gain.setValueAtTime(0.1, ctx.currentTime);
            g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.connect(g); g.connect(masterGain);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }
    };

    let user = JSON.parse(localStorage.getItem('jolgo_v8')) || { name:'', xp:0, solved:[], lang:'ky' };

    function initApp() {
        const n = document.getElementById('u-in').value.trim();
        if(!n) return alert("Write Name!");
        user.name = n;
        document.getElementById('auth').style.display='none';
        playSound('win');
        updateUI();
    }

    function setL(l) {
        user.lang = l;
        updateUI();
    }

    function updateUI() {
        const lang = user.lang;
        const dict = i18n[lang];
        document.getElementById('u-name').innerText = user.name;
        document.getElementById('xp-val').innerText = user.xp;
        let tIdx = Math.min(Math.floor(user.xp / 1000), 5);
        document.getElementById('u-title').innerText = dict.titles[tIdx];
        document.getElementById('tab-home').innerHTML = `🏠<br>${dict.home}`;
        document.getElementById('tab-map').innerHTML = `🗺️<br>${dict.map}`;
        document.getElementById('tab-prof').innerHTML = `👤<br>${dict.prof}`;
        document.getElementById('ui-achive').innerText = `🏅 ${dict.achive}`;
        document.getElementById('ui-lead').innerText = `📊 ${dict.lead}`;
        document.getElementById('cert-head').innerText = dict.certH;
        document.getElementById('cert-text1').innerText = dict.certT1;
        document.getElementById('cert-text2').innerText = dict.certT2;
        renderCards(); renderBadges(); renderLeaderboard();
        localStorage.setItem('jolgo_v8', JSON.stringify(user));
        if(user.solved.length === 5) showCert();
    }

    function renderCards() {
        const list = document.getElementById('list'); list.innerHTML = '';
        places.forEach(p => {
            const ok = user.solved.includes(p.id);
            list.innerHTML += `<div class="card" onclick="openInfo(${p.id})">
                <img src="${p.img}">
                <div style="padding:15px">
                    <h3 style="margin:0">${p.n[user.lang]} ${ok?'✅':''}</h3>
                    <button class="btn btn-main" style="height:35px; padding:0; font-size:12px;">${ok?'REPLAY':i18n[user.lang].start}</button>
                </div>
            </div>`;
        });
    }

    function renderBadges() {
        const box = document.getElementById('badge-display'); box.innerHTML = '';
        places.forEach(p => {
            const ok = user.solved.includes(p.id);
            box.innerHTML += `<div class="badge-box ${ok?'unlocked':''}">
                <div style="font-size:24px">${ok?'🏅':'🔒'}</div>
                <div style="font-size:10px; font-weight:bold;">${p.t[user.lang]}</div>
            </div>`;
        });
    }

    function renderLeaderboard() {
        document.getElementById('rank-box').innerHTML = `<div class="rank-item" style="color:var(--main)"><span>1. ${user.name}</span><b>${user.xp} XP</b></div>`;
    }

    function openInfo(id) {
        const p = places.find(x => x.id === id);
        document.getElementById('info-n').innerText = p.n[user.lang];
        document.getElementById('info-t').innerText = p.desc[user.lang];
        document.getElementById('q-start').innerText = i18n[user.lang].start;
        document.getElementById('q-start').onclick = () => { closeM('info-modal'); startQ(id); };
        document.getElementById('info-modal').style.display = 'flex';
    }

    function startQ(id) {
        const p = places.find(x => x.id === id);
        document.getElementById('quiz-modal').style.display = 'flex';
        document.getElementById('q-txt').innerText = p.q[user.lang];
        const box = document.getElementById('q-opt'); box.innerHTML = '';
        p.a.forEach((a, i) => box.innerHTML += `<div class="opt" onclick="check(${id}, ${i})">${a}</div>`);
    }

    function check(pid, idx) {
        const p = places.find(x => x.id === pid);
        if(idx === p.c) {
            playSound('win');
            if(!user.solved.includes(pid)) { user.xp += 1000; user.solved.push(pid); confetti(); }
        } else { 
            playSound('err'); 
            alert(i18n[user.lang].err); 
        }
        closeM('quiz-modal'); updateUI();
    }

    function showCert() {
        document.getElementById('cert-user').innerText = user.name;
        document.getElementById('cert-overlay').style.display = 'flex';
        playSound('win');
    }

    function closeM(id) { document.getElementById(id).style.display = 'none'; }
    function go(p, el) {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
    }

    let map;
    function initMap() {
        if(map) return;
        setTimeout(() => {
            map = L.map('map').setView([42.52, 72.24], 8);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            places.forEach(p => L.marker([p.x, p.y]).addTo(map).bindPopup(p.n[user.lang]));
        }, 400);
    }
    if(user.name) { document.getElementById('auth').style.display = 'none'; updateUI(); }
</script>
</body>
</html>
