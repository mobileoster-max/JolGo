<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JolGo 9999: Reborn</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1356/1356479.png">
    <style>
        :root { --gold: #ffd700; --main: #00ff88; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Arial Black', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #app { text-align: center; width: 90%; max-width: 400px; padding: 30px; border: 2px solid var(--main); border-radius: 20px; background: #1a1a1a; }
        input { width: 80%; padding: 15px; margin: 20px 0; border-radius: 10px; border: none; font-size: 16px; text-align: center; }
        button { background: var(--main); color: #000; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; }
        h1 { color: var(--gold); margin-bottom: 10px; }
        .hidden { display: none !important; }
        #game-screen { color: var(--main); font-size: 20px; }
    </style>
</head>
<body>

    <div id="app">
        <div id="auth-screen">
            <h1>JOLGO</h1>
            <p>Аты-жөнүңдү жаз:</p>
            <input type="text" id="username" placeholder="Сиздин ысымыңыз..." autocomplete="off">
            <button onclick="startGame()">БАШТОО</button>
        </div>

        <div id="game-screen" class="hidden">
            <h1 id="welcome-msg"></h1>
            <p>🚀 Оюн ийгиликтүү жүктөлдү!</p>
            <p>Талас картасы даяр.</p>
            <button onclick="location.reload()">КАЙРА ЖАҢЫЛОО</button>
        </div>
    </div>

    <script>
        function startGame() {
            const name = document.getElementById('username').value;
            if (name.trim() !== "") {
                localStorage.setItem('jolgo_user', name);
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = "Салам, " + name + "!";
            } else {
                alert("Сураныч, атыңызды жазыңыз!");
            }
        }

        // Эгер мурун кирген болсо, дароо оюнду көрсөтүү
        window.onload = () => {
            const savedName = localStorage.getItem('jolgo_user');
            if (savedName) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = "Салам, " + savedName + "!";
            }
        };
    </script>
</body>
</html>
